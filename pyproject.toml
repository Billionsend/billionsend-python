[project]
name = "billionsend"
version = "0.4.0"
description = "Python SDK for the BillionSend email API: sending, receiving, inboxes for agents, contacts, broadcasts and more."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BillionSend" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]
keywords = ["billionsend", "email", "api", "sdk", "inbox", "smtp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://billionsend.com"
Documentation = "https://billionsend.com/docs/sdks/python"
Repository = "https://github.com/billionsend/billionsend-python"
Changelog = "https://github.com/billionsend/billionsend-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "jsonschema>=4.23",
  "types-jsonschema>=4.23",
  "referencing>=0.35",
  "coverage>=7.6",
  "rfc3339-validator>=0.1.4",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billionsend"]

[tool.hatch.build.targets.sdist]
include = ["src/billionsend", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "e2e"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PIE", "PT", "RET", "TC"]
ignore = ["S101", "TC001", "TC002", "TC003", "RUF022"]

[tool.ruff.lint.per-file-ignores]
"src/billionsend/types.py" = ["E501"]
"src/billionsend/resources/_*.py" = ["E501"]
"tests/*" = ["S105", "S106"]
"e2e/*" = ["S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts", "e2e"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src/billionsend"]

[tool.coverage.report]
show_missing = true
skip_empty = true
