name: release

# Publishes billionsend to PyPI at the version pyproject.toml declares, via
# Trusted Publishing (OIDC): no token is stored. Run it by hand (Actions →
# release → Run workflow) on a version tag. PyPI accepts a "pending publisher"
# for a project that does not exist yet, so the first version can go through
# this workflow too; see "Releasing" in the README.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      # Only a tag that names the project's version publishes, so the number on
      # PyPI is always a commit you can find.
      - name: Run from the tag of the project version
        run: |
          test "$GITHUB_REF_TYPE" = tag
          test "v$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python scripts/generate.py --check
      - run: uv run coverage run -m pytest
      - run: |
          uv run coverage json
          uv run python scripts/check_coverage.py
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always dist/*
