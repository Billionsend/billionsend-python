name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Generated code matches the OpenAPI snapshot
        run: uv run python scripts/generate.py --check

  snapshot:
    name: Snapshot matches the published API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Snapshot equals https://billionsend.com/docs/api.openapi.json
        run: python3 scripts/sync_openapi.py --check

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Tests with line and branch coverage
        run: uv run coverage run -m pytest
      - name: Coverage gate (hand-written code at least 95 %, every generated method called)
        run: |
          uv run coverage json
          uv run python scripts/check_coverage.py

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv build
      - name: Wheel ships the type marker and installs cleanly
        run: |
          unzip -l dist/*.whl | grep -q 'billionsend/py.typed'
          uv venv /tmp/wheel-check
          VIRTUAL_ENV=/tmp/wheel-check uv pip install dist/*.whl
          /tmp/wheel-check/bin/python -c "import billionsend; print(billionsend.__version__)"
